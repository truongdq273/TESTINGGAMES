<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đập chuột · Thử hiệu ứng</title><link rel="stylesheet" href="styles.css"><body><div class="shell"><header class="topbar"><a class="brand" href="index.html"><span class="brand-icon">🌱</span><span>ĐẬP CHUỘT<small>KHU VƯỜN TINH ANH</small></span></a><span class="pill">THỬ HIỆU ỨNG</span></header><div class="narrow" style="max-width:720px"><h1 style="font-size:36px">Thử búa và âm thanh</h1><p class="muted">Xem trước cơ chế đúng/sai. Màn này không chứa câu hỏi học thuật và không tính điểm lớp học.</p><div class="actions" style="margin-bottom:20px"><button id="try-correct">Thử trả lời đúng</button><button id="try-wrong" class="secondary">Thử trả lời sai</button><button id="mute" class="secondary" aria-label="Bật hoặc tắt âm thanh">Âm thanh: bật</button></div><section class="game-stage" style="min-height:400px"><div class="garden" style="margin-top:0"><div id="callout" class="hit-callout">Mình đang đợi bạn!</div><span class="grass">🌿</span><span class="grass right">🌼</span><div class="mole-slot"><img class="hole" src="assets/hole.png" alt=""><div class="mouse-window"><button class="mouse-target" id="mouse" disabled aria-label="Đập chuột"><img src="assets/mouse.png" alt="Chú chuột"></button></div><img id="mallet" class="mallet" src="assets/hammer.png" alt=""></div></div><div class="feedback" role="status"><p id="feedback">Chọn một hiệu ứng phía trên để thử.</p><button id="reset" class="gold small">Chuột xuất hiện lại</button></div></section></div></div><script type="module">
import {unlock,sfx,toggleMute,isMuted} from './audio.js';
const $=s=>document.querySelector(s);let ready=false;
function reset(){ready=false;$('#mouse').className='mouse-target';$('#mouse').disabled=true;$('#mallet').className='mallet';$('#callout').textContent='Mình đang đợi bạn!';$('#feedback').textContent='Chọn một hiệu ứng phía trên để thử.'}
$('#try-correct').onclick=()=>{unlock();reset();ready=true;sfx('correct');$('#mouse').disabled=false;$('#mouse').classList.add('ready');$('#callout').textContent='Bấm vào chuột!';$('#feedback').textContent='Chính xác! +10 điểm. Bây giờ bạn có thể đập chuột.'};
$('#try-wrong').onclick=()=>{unlock();reset();sfx('miss');$('#mouse').classList.add('away');$('#callout').textContent='Chuột trốn mất rồi!';$('#feedback').textContent='Chưa đúng, +0 điểm. Thử lại ở lượt tiếp theo nhé.'};
$('#mouse').onclick=()=>{if(!ready)return;ready=false;unlock();sfx('hit');$('#mouse').className='mouse-target hit';$('#mouse').disabled=true;$('#mallet').classList.add('swing');$('#callout').textContent='Đập trúng rồi!';$('#feedback').textContent='Bốp! Bạn đã bắt được chú chuột tinh nghịch.'};
$('#reset').onclick=()=>{unlock();reset();sfx('pop')};$('#mute').textContent=isMuted()?'Âm thanh: tắt':'Âm thanh: bật';$('#mute').onclick=()=>{unlock();toggleMute();$('#mute').textContent=isMuted()?'Âm thanh: tắt':'Âm thanh: bật'};
</script></body></html>
